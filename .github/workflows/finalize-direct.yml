name: Publish final ABWEICHUNG files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-direct.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install python-docx pyphen
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer python3-uno hyphen-de poppler-utils \
            fonts-noto-core fonts-noto-extra fonts-dejavu fonts-dejavu-extra \
            fonts-liberation fonts-linuxlibertine fonts-crosextra-caladea fonts-crosextra-carlito
          fc-cache -f
          fc-match Garamond

      - name: Rebuild canonical G4 manuscript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_production.py \
            --source-ref 19934e138422e72e7433bc8b9be0c96c1cdb1044 \
            --out-dir /tmp/abweichung-g4
          python - <<'PY'
          import json
          info = json.load(open('/tmp/abweichung-g4/BUILD_INFO.json'))
          assert info['scene_count'] == 40, info['scene_count']
          assert info['hard_guard_sondern_count'] == 0
          print(f"source validation OK: scenes={info['scene_count']}, words={info['word_count']}")
          PY

      - name: Build final Markdown and DOCX
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_final_manuscript.py \
            --source /tmp/abweichung-g4/ABWEICHUNG_v01.md \
            --output ABWEICHUNG_FINAL.md
          python scripts/build_final_docx.py \
            --source ABWEICHUNG_FINAL.md \
            --output ABWEICHUNG_FINAL.docx
          unzip -t ABWEICHUNG_FINAL.docx >/dev/null

      - name: Validate rework markers in Markdown
        shell: python
        run: |
          from pathlib import Path
          text = Path('ABWEICHUNG_FINAL.md').read_text(encoding='utf-8')
          assert 'Frau Dr. Riedel' in text
          assert 'Frau Dr. König' not in text
          assert 'high-confidence Ressourcen-/Eskalationsklasse' in text
          assert 'Meine Bilanz in der Ressourcen-/Eskalationsklasse' in text
          print('G4 rework markers OK')

      - name: Validate pre-TOC document contract
        shell: python
        run: |
          from docx import Document
          from docx.oxml.ns import qn

          doc = Document('ABWEICHUNG_FINAL.docx')
          assert len(doc.sections) == 2, len(doc.sections)
          for section in doc.sections:
              assert abs(section.page_width.cm - 12.85) < 0.02
              assert abs(section.page_height.cm - 19.84) < 0.02
              assert abs(section.top_margin.cm - 1.22) < 0.02
              assert abs(section.bottom_margin.cm - 1.22) < 0.02
              assert abs(section.left_margin.cm - 1.95) < 0.02
              assert abs(section.right_margin.cm - 1.40) < 0.02
          headings = [p.text for p in doc.paragraphs if p.style and p.style.name == 'Heading 1']
          assert len(headings) == 40, len(headings)
          assert headings[0] == 'Kapitel 1 – Die letzte Kapazität'
          assert headings[-1] == 'Kapitel 40 – Was sieht KORA nicht?'
          soft = sum(len(p._p.xpath('.//w:softHyphen')) for p in doc.paragraphs)
          assert soft > 20000, soft
          settings = doc.settings._element
          for name in ('autoHyphenation', 'mirrorMargins', 'evenAndOddHeaders'):
              assert settings.find(qn(f'w:{name}')) is not None, name
          print(f'pre-TOC validation OK: headings={len(headings)}, softHyphens={soft}')

      - name: Materialize table of contents
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Satte882/Buch.git /tmp/Buch
          /usr/bin/python3 /tmp/Buch/scripts/update_docx_toc.py ABWEICHUNG_FINAL.docx
          unzip -t ABWEICHUNG_FINAL.docx >/dev/null

      - name: Render smoke test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from docx import Document
          doc = Document('ABWEICHUNG_FINAL.docx')
          headings = [p.text for p in doc.paragraphs if p.style and p.style.name == 'Heading 1']
          assert len(headings) == 40, len(headings)
          assert headings[0] == 'Kapitel 1 – Die letzte Kapazität'
          assert headings[-1] == 'Kapitel 40 – Was sieht KORA nicht?'
          print('post-TOC heading validation OK')
          PY
          mkdir -p /tmp/qa
          libreoffice --headless --convert-to pdf --outdir /tmp/qa ABWEICHUNG_FINAL.docx >/dev/null
          test -s /tmp/qa/ABWEICHUNG_FINAL.pdf
          PAGES=$(pdfinfo /tmp/qa/ABWEICHUNG_FINAL.pdf | awk '/^Pages:/ {print $2}')
          test -n "$PAGES"
          echo "render smoke test OK: $PAGES pages"

      - name: Commit final files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ABWEICHUNG_FINAL.md ABWEICHUNG_FINAL.docx
          if git diff --cached --quiet; then
            echo 'No final-file changes to commit.'
            exit 0
          fi
          git commit -m 'production: publish G4-reworked ABWEICHUNG manuscript'
          git pull --rebase origin main
          git push origin HEAD:main
