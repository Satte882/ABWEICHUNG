name: Install approved ABWEICHUNG cover

on:
  push:
    branches: [main]
    paths:
      - '.cover_upload/COMPLETE'

permissions:
  contents: write

jobs:
  install-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct approved cover and build font-free KDP PDF
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          parts = sorted(Path('.cover_upload').glob('part_*.txt'))
          if not parts:
              raise SystemExit('No cover chunks found')
          encoded = ''.join(p.read_text() for p in parts)
          jpg = base64.b64decode(encoded, validate=True)
          Path('/tmp/cover.jpg').write_bytes(jpg)

          # Approved KDP geometry from COVER_SPEC.md
          W_IN = 10.894716
          H_IN = 8.060
          W_PT = W_IN * 72
          H_PT = H_IN * 72
          IMG_W = 3268
          IMG_H = 2418

          # Minimal one-page PDF with a single JPEG XObject and no font resources.
          objects = []
          objects.append(b'<< /Type /Catalog /Pages 2 0 R >>')
          objects.append(b'<< /Type /Pages /Count 1 /Kids [3 0 R] >>')
          objects.append(
              f'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 {W_PT:.6f} {H_PT:.6f}] '
              f'/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'.encode('ascii')
          )
          img_dict = (
              f'<< /Type /XObject /Subtype /Image /Width {IMG_W} /Height {IMG_H} '
              f'/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length {len(jpg)} >>\nstream\n'
          ).encode('ascii') + jpg + b'\nendstream'
          objects.append(img_dict)
          content = f'q\n{W_PT:.6f} 0 0 {H_PT:.6f} 0 0 cm\n/Im0 Do\nQ\n'.encode('ascii')
          objects.append(f'<< /Length {len(content)} >>\nstream\n'.encode('ascii') + content + b'endstream')

          out = bytearray(b'%PDF-1.4\n%\xe2\xe3\xcf\xd3\n')
          offsets = [0]
          for i, obj in enumerate(objects, start=1):
              offsets.append(len(out))
              out += f'{i} 0 obj\n'.encode('ascii') + obj + b'\nendobj\n'
          xref = len(out)
          out += f'xref\n0 {len(objects)+1}\n'.encode('ascii')
          out += b'0000000000 65535 f \n'
          for off in offsets[1:]:
              out += f'{off:010d} 00000 n \n'.encode('ascii')
          out += (
              f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\n'
              f'startxref\n{xref}\n%%EOF\n'
          ).encode('ascii')
          Path('ABWEICHUNG_COVER.pdf').write_bytes(out)

          # Technical guards.
          data = bytes(out)
          assert b'/MediaBox [0 0 784.419552 580.320000]' in data
          assert b'/Font' not in data
          assert data.count(b'/Type /Page ') == 1
          assert len(jpg) > 500_000
          print('cover OK:', W_IN, 'x', H_IN, 'in;', IMG_W, 'x', IMG_H, 'px; no fonts')
          PY

      - name: Commit production cover and remove upload chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ABWEICHUNG_COVER.pdf
          git rm -r .cover_upload
          git commit -m 'cover: install approved dark glitch KDP cover'
          git push
