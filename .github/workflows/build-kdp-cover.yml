name: Build KDP cover

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_kdp_cover.py'
      - 'COVER_SPEC.md'
      - '.github/workflows/build-kdp-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip
          pip install reportlab pypdf

      - name: Build cover
        run: |
          python scripts/build_kdp_cover.py --pages 333 --paper white --output ABWEICHUNG_COVER.pdf

      - name: Validate PDF
        run: |
          pdfinfo ABWEICHUNG_COVER.pdf
          pdffonts ABWEICHUNG_COVER.pdf
          python - <<'PY'
          from pypdf import PdfReader
          reader = PdfReader('ABWEICHUNG_COVER.pdf')
          assert len(reader.pages) == 1
          box = reader.pages[0].mediabox
          width = float(box.width) / 72
          height = float(box.height) / 72
          assert abs(width - 11.119916) < 0.001, (width, height)
          assert abs(height - 8.060) < 0.001, (width, height)
          print('cover geometry OK', width, height)
          PY
          if pdffonts ABWEICHUNG_COVER.pdf | tail -n +3 | awk 'NF && $4 != "yes" {exit 1}'; then
            echo 'font embedding OK'
          else
            echo 'non-embedded font found' >&2
            exit 1
          fi

      - name: Commit production PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ABWEICHUNG_COVER.pdf
          if git diff --cached --quiet; then
            echo 'No cover change.'
          else
            git commit -m 'production: build ABWEICHUNG KDP cover'
            git push
          fi
