name: Finalize final manuscript files

on:
  push:
    branches: [main]
    paths:
      - '.tmp_final_upload/READY'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct final files
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp_final_upload/chunk-*.b64 > /tmp/abweichung_final_bundle.b64
          base64 -d /tmp/abweichung_final_bundle.b64 > /tmp/abweichung_final_bundle.zip
          echo '24e8acae4c18ea98542d56257db51ba7f44669690c6868f8ccc8bc3b41866cf7  /tmp/abweichung_final_bundle.zip' | sha256sum -c -
          unzip -q /tmp/abweichung_final_bundle.zip -d /tmp/abweichung_final
          cp /tmp/abweichung_final/ABWEICHUNG_FINAL.md ./ABWEICHUNG_FINAL.md
          cp /tmp/abweichung_final/ABWEICHUNG_FINAL.docx ./ABWEICHUNG_FINAL.docx
          echo '1abe62812ad8040d296938cee878ccc3b2e9fbcc980c66d61c8d4c52c7d23c45  ABWEICHUNG_FINAL.md' | sha256sum -c -
          echo '7a5d20595627edbad938bcbcdca4b5a7cbc25d8a2760266cccab794bd7424ac7  ABWEICHUNG_FINAL.docx' | sha256sum -c -
          unzip -t ABWEICHUNG_FINAL.docx >/dev/null
      - name: Commit final files and remove staging material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ABWEICHUNG_FINAL.md ABWEICHUNG_FINAL.docx
          git rm -r .tmp_final_upload
          git rm .github/workflows/finalize-final-files.yml
          git commit -m 'production: add final ABWEICHUNG manuscript files'
          git push origin HEAD:main
