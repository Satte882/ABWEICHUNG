name: Finalize final manuscript files

on:
  push:
    branches: [main]
    paths:
      - '.tmp_final_upload/READY'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct final DOCX
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp_final_upload/chunk-*.b64 > /tmp/ABWEICHUNG_FINAL.docx.xz.b64
          base64 -d /tmp/ABWEICHUNG_FINAL.docx.xz.b64 > /tmp/ABWEICHUNG_FINAL.docx.xz
          echo '7d276d612ae20c38069fa779dce5e48fd0cf3e0732f689638dada3d7d537645b  /tmp/ABWEICHUNG_FINAL.docx.xz' | sha256sum -c -
          xz -d /tmp/ABWEICHUNG_FINAL.docx.xz
          cp /tmp/ABWEICHUNG_FINAL.docx ./ABWEICHUNG_FINAL.docx
          echo '7a5d20595627edbad938bcbcdca4b5a7cbc25d8a2760266cccab794bd7424ac7  ABWEICHUNG_FINAL.docx' | sha256sum -c -
          unzip -t ABWEICHUNG_FINAL.docx >/dev/null

      - name: Reconstruct final Markdown from approved G5 artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9752446466/zip > /tmp/g5.zip
          mkdir -p /tmp/g5
          unzip -q /tmp/g5.zip -d /tmp/g5
          python - <<'PY'
          from pathlib import Path
          import re

          titles = [
              'Die letzte Kapazität',
              'Der sichtbare Erfolg',
              'Am Morgen danach',
              'Die besseren Zahlen',
              'Die Bettenkette',
              'Was Eva nicht sah',
              'Laura Berg',
              'Ein Grund',
              'Freitext',
              'Neles Entscheidung',
              'Zu spät',
              'Zweite Unterschrift',
              'Schutz oder Gehorsam',
              'Getrennte Daten',
              'Wo KORA irrt',
              'Zu wenig Widerspruch',
              'Der Zeitpunkt',
              'Meine Fälle',
              'Die Bilanz',
              'Die neue Schwelle',
              'Kein Gegenbeleg',
              'Die Chronologie',
              'Würden Sie es wieder tun?',
              'Zwei Wege',
              'Was nicht in den Daten steht',
              'Zu viele Ausnahmen',
              'Nähe zählt nicht',
              'Unter der Schwelle',
              'Zeitstempel',
              'Felix',
              'Drei Risiken',
              'Break Glass',
              'Alles belegt',
              'Beide Patienten',
              'Du siehst ihn nicht',
              'Der Knopf',
              'Vor ihr',
              'Der andere Patient',
              'Human Oversight',
              'Was sieht KORA nicht?',
          ]

          src = Path('/tmp/g5/ABWEICHUNG_v01.md').read_text(encoding='utf-8')
          if not src.startswith('# ABWEICHUNG\n'):
              raise SystemExit('unexpected G5 source title')

          front = (
              '# ABWEICHUNG\n\n'
              '*Wenn die Maschine recht hat*\n\n'
              '> Du darfst widersprechen.  \n'
              '> Die Beweislast liegt bei dir.\n\n'
          )
          body = src[len('# ABWEICHUNG\n'):].lstrip('\n')

          seen = []
          def repl(m):
              n = int(m.group(1))
              if not 1 <= n <= len(titles):
                  raise SystemExit(f'unexpected chapter number {n}')
              seen.append(n)
              return f'## Kapitel {n} – {titles[n-1]}'

          body = re.sub(r'^## Kapitel (\d+)$', repl, body, flags=re.M)
          if seen != list(range(1, 41)):
              raise SystemExit(f'chapter sequence mismatch: {seen}')

          Path('ABWEICHUNG_FINAL.md').write_text(front + body, encoding='utf-8')
          PY
          echo '1abe62812ad8040d296938cee878ccc3b2e9fbcc980c66d61c8d4c52c7d23c45  ABWEICHUNG_FINAL.md' | sha256sum -c -

      - name: Commit final files and remove staging material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ABWEICHUNG_FINAL.md ABWEICHUNG_FINAL.docx
          git rm -r .tmp_final_upload
          git rm .github/workflows/finalize-final-files.yml
          git commit -m 'production: add final ABWEICHUNG manuscript files'
          git push origin HEAD:main
