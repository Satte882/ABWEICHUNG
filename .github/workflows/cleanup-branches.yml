name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete redundant branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            STOP-CREATING-BRANCHES \
            full-prose-generation \
            g4-safety-temp \
            noop \
            __cleanup_test_should_not_exist \
            __delete_me
          do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done
