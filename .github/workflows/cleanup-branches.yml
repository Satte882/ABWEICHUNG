name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete redundant branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            STOP-CREATING-BRANCHES \
            full-prose-generation \
            g4-safety-temp \
            noop \
            __cleanup_test_should_not_exist \
            __delete_me
          do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" 2>/dev/null || true
          done

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-branches.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:main
