name: Publish G4 manuscript Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-g4-md.yml'
      - 'scripts/apply_external_dialogue_rework.py'
      - 'BAUSTEINE/**/PROSA.md'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted external-dialogue rework
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_external_dialogue_rework.py

      - name: Compact safe vertical staccato and rebuild manuscript
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_final_prose_rhythm_pass.py
          # The script also writes a historical gate report whose wording belongs to
          # the earlier pass. Keep the current repository version unchanged here.
          git restore FINAL_PROSE_RHYTHM_APPLIED.md

      - name: Run final post-external-major prose audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/final_prose_rhythm_audit.py \
            --output FINAL_PROSE_RHYTHM_AUDIT_EXTERNAL_REWORK.md \
            --status POST_EXTERNAL_MAJOR_REWORK_FINAL

      - name: Validate manuscript contract and XR-002 regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('ABWEICHUNG_FINAL.md').read_text(encoding='utf-8')
          assert text.count('\n## Kapitel ') == 40
          assert 'Frau Dr. Riedel' in text
          assert 'Frau Dr. König' not in text
          assert 'high-confidence Ressourcen-/Eskalationsklasse' in text
          assert 'Meine Bilanz in der Ressourcen-/Eskalationsklasse' in text
          assert '—' not in text
          assert not re.search(r'\bsondern\b', text, flags=re.I)
          assert text.rstrip().endswith('Eva wartete.')

          audit = Path('FINAL_PROSE_RHYTHM_AUDIT_EXTERNAL_REWORK.md').read_text(encoding='utf-8')
          assert '- Szenen: **40**' in audit
          assert '- Geviertstrich `—`: **0**' in audit
          assert '- `sondern`: **0**' in audit
          m = re.search(r'- Dialog-Pingpong-Runs: \*\*(\d+)\*\*', audit)
          assert m, 'dialogue metric missing'
          dialogue_runs = int(m.group(1))
          # Post-rhythm pre-external baseline was 58; first scene-shape rework was 44.
          # Final targeted regression must materially improve again.
          assert dialogue_runs <= 34, dialogue_runs
          print(f'G4 external-major regression validation OK; dialogue runs={dialogue_runs}')
          PY

      - name: Commit reworked prose, manuscript and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BAUSTEINE/**/SZENEN/**/PROSA.md ABWEICHUNG_FINAL.md FINAL_PROSE_RHYTHM_AUDIT_EXTERNAL_REWORK.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'production: finalize external-major dialogue rework'
          git pull --rebase origin main
          git push origin HEAD:main
