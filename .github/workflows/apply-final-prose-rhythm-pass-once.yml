name: Apply final prose rhythm pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-prose-rhythm-pass-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply whole-book pass and rebuild Markdown
        run: python scripts/apply_final_prose_rhythm_pass.py

      - name: Run post-pass audit
        run: python scripts/final_prose_rhythm_audit.py --output FINAL_PROSE_RHYTHM_AUDIT_POST.md --status POST_REWORK

      - name: Validate regression and improvement
        run: python scripts/validate_final_prose_rhythm_pass.py

      - name: Commit prose pass and self-clean workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-final-prose-rhythm-pass-once.yml
          git add BAUSTEINE ABWEICHUNG_FINAL.md FINAL_PROSE_RHYTHM_APPLIED.md FINAL_PROSE_RHYTHM_AUDIT_POST.md FINAL_PROSE_RHYTHM_COMPARISON.md
          git commit -m 'Apply final whole-book prose rhythm pass'
          git pull --rebase origin main
          git push origin HEAD:main
